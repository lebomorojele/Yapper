name: Verify Yapper
on:
  push:
    branches: [main, feat/yapper-evening-release]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path app
      - name: Transcribe real speech on device
        env:
          YAPPER_RUN_STT_INTEGRATION: "1"
        run: swift test --package-path app --filter RealTranscriptionTests
      - run: swift build -c release --package-path app
      - name: Package app
        run: ALLOW_PLACEHOLDER_SPARKLE_KEY=1 app/scripts/package-dmg.sh
      - name: Launch the packaged app and capture native screens
        run: app/scripts/smoke-bundle.sh
      - name: Sign update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: app/scripts/generate-appcast.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Yapper-macOS
          path: |
            app/dist/*.dmg
            app/dist/*.sha256
            app/dist/*.png
            app/dist/*-smoke.log
            app/dist/sparkle/appcast.xml
          if-no-files-found: error
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  native-ui:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate the native Xcode project
        working-directory: app
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Exercise native settings screens
        run: >-
          xcodebuild test -project app/Yapper.xcodeproj -scheme Yapper
          -destination 'platform=macOS' -only-testing:YapperUITests
          -resultBundlePath app/dist/NativeUI.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yapper-native-ui
          path: |
            app/dist/NativeUI.xcresult
            app/Yapper.xcodeproj
