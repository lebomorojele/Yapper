name: Yapper
options:
  bundleIdPrefix: com.yapper
  deploymentTarget:
    macOS: '15.0'
  xcodeVersion: '15.0'
  generateEmptyDirectories: true
packages:
  speech-swift:
    url: https://github.com/soniqo/speech-swift
    exactVersion: 0.0.9
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.1
targets:
  Yapper:
    type: application
    platform: macOS
    sources:
    - path: Yapper
      excludes:
      - Assets.xcassets/**
      - Support/**
      - BrandResources/**
      - LocalInference/**
      - MenuBarResources/**
      - Sounds/**
    - path: Yapper/Assets.xcassets
      buildPhase: resources
    - path: Yapper/BrandResources
      type: folder
      buildPhase: resources
    - path: Yapper/LocalInference
      type: folder
      buildPhase: resources
    - path: Yapper/MenuBarResources
      type: folder
      buildPhase: resources
    - path: Yapper/Sounds
      type: folder
      buildPhase: resources
    dependencies:
    - package: speech-swift
      product: ParakeetStreamingASR
    - package: Sparkle
      product: Sparkle
    settings:
      base:
        PRODUCT_NAME: Yapper
        PRODUCT_BUNDLE_IDENTIFIER: com.yapper.party
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: '2'
        INFOPLIST_FILE: Yapper/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Yapper/Support/Yapper.entitlements
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS:
        - '@executable_path/../Frameworks'
        SWIFT_VERSION: '6.0'
  YapperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
    - path: Tests/YapperTests
      excludes:
      - Fixtures/**
    - path: Tests/YapperTests/Fixtures
      type: folder
      buildPhase: resources
    dependencies:
    - target: Yapper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yapper.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Yapper.app/Contents/MacOS/Yapper
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_VERSION: '6.0'
  YapperUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
    - path: Tests/YapperUITests
    dependencies:
    - target: Yapper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yapper.uitests
        SWIFT_VERSION: '6.0'
        TEST_TARGET_NAME: Yapper
schemes:
  Yapper:
    build:
      targets:
        Yapper: all
    test:
      environmentVariables:
        YAPPER_UI_TEST_MODE: '1'
      targets:
      - YapperTests
      - YapperUITests
